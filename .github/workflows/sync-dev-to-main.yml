# ============================================
# Dev 分支同步到 Main
# 功能：当 PR 合并到 dev 分支时，自动将更改同步到 main 分支
# 目的：保持 main 和 dev 分支同步，遵循"dev 修改 -> PR 合并到 main 部署"的规则
# 实现方式：通过 GitHub API 创建 PR 并自动合并（绕过分支保护规则）
# ============================================

name: Sync Dev to Main

# 触发条件：当 PR 合并到 dev 分支时
on:
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  # 任务：同步到 main
  sync-to-main:
    # 仅在 PR 已合并时执行
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # 权限设置：需要写入代码仓库、管理 PR 的权限
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # 步骤1：检出 dev 分支（PR 已合并到此分支）
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0  # 获取完整历史用于合并

      # 步骤2：创建从 dev 到 main 的 PR 并自动合并
      - name: Create PR and merge to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取当前 dev 分支的最新提交信息
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_SHA=$(git log -1 --pretty=%h)

          echo "正在从 dev 同步到 main..."
          echo "最新提交: $COMMIT_MSG ($COMMIT_SHA)"

          # 创建从 dev 到 main 的 PR
          PR_URL=$(gh pr create \
            --base main \
            --head dev \
            --title "sync: ${COMMIT_MSG}" \
            --body "自动同步 dev 分支到 main 分支

          提交: ${COMMIT_MSG} (${COMMIT_SHA})

          > 此 PR 由 Sync Dev to Main 工作流自动创建并合并。" \
            2>&1)

          echo "PR 已创建: $PR_URL"

          # 提取 PR 编号
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+' | tail -1)

          # 等待几秒确保 PR 创建完成
          sleep 3

          # 自动合并 PR（使用 --admin 绕过分支保护规则）
          gh pr merge $PR_NUM --merge --admin

          echo "已成功合并到 main 分支"

      # 步骤2.5：更新 songFiles.js（通过创建 PR 并 API 合并，绕过分支保护）
      - name: Update songFiles.js
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 切换到 main 分支（此时 main 已有最新歌词）
          git checkout main
          git pull origin main
          
          # 生成 songFiles.js
          echo "// 歌曲清单（自动生成，请勿手动修改）" > songFiles.js
          echo "const songFiles = [" > songFiles.js
          count=0
          while IFS= read -r f; do
              echo "    '"'"'$f'"'"'," >> songFiles.js
              count=$((count + 1))
          done < <(find lyrics -maxdepth 1 -name '*.js' -type f | sort)
          echo "];" >> songFiles.js
          
          echo "生成完成，共 $count 首歌曲"
          
          # 检查是否有变更
          if git diff --quiet songFiles.js; then
            echo "songFiles.js 无变更，跳过"
            exit 0
          fi
          
          # 创建新分支（不能直接 push 到 main，main 是保护分支）
          branch="auto/update-songfiles-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add songFiles.js
          git commit -m "chore: 自动更新歌曲清单（共 $count 首）"
          git push origin "$branch"
          
          # 创建 PR 到 main 并通过 API 合并
          sleep 2
          pr_response=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{\"title\":\"chore: 自动更新歌曲清单\",\"body\":\"此 PR 由 Sync Dev to Main 工作流自动生成。\",\"head\":\"$branch\",\"base\":\"main\"}")
          pr_num=$(echo "$pr_response" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number',''))" 2>/dev/null)
          
          if [ -z "$pr_num" ]; then
            echo "❌ songFiles PR 创建失败"
            git push origin --delete "$branch" 2>/dev/null
            exit 0
          fi
          
          echo "songFiles PR #$pr_num 已创建"
          
          # 合并 PR
          sleep 3
          merge_response=$(curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$pr_num/merge" \
            -d '{"merge_method":"squash"}')
          merged=$(echo "$merge_response" | python3 -c "import sys,json; print(json.load(sys.stdin).get('merged',False))" 2>/dev/null)
          
          if [ "$merged" = "True" ]; then
            echo "✅ songFiles.js 已更新到 main"
            # 删除分支
            git push origin --delete "$branch" 2>/dev/null
          else
            echo "❌ songFiles PR 合并失败"
            git push origin --delete "$branch" 2>/dev/null
          fi

      # 步骤3：获取合并的 PR 信息，清理相关分支
      - name: Cleanup branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有以 fix/ 或 new-song/ 开头的远程分支
          for branch in $(git branch -r | grep -E "origin/(fix/|new-song/|auto/)" | sed 's/origin\///' | tr -d ' '); do
            # 尝试删除远程分支
            if gh api "repos/{owner}/{repo}/git/refs/heads/$branch" --silent 2>/dev/null; then
              git push origin --delete "$branch" 2>/dev/null && echo "已删除分支: $branch" || echo "无法删除分支: $branch"
            fi
          done

      # 步骤4：关闭关联的 Issue（如果 PR 描述中包含 Fixes #XX）
      - name: Close related issues
        if: always()  # 即使前面的步骤失败也执行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取触发此工作流的原始 PR 编号
          ORIGINAL_PR=${{ github.event.pull_request.number }}

          # 获取原始 PR 的描述，查找 Fixes #XX
          PR_BODY=$(gh pr view $ORIGINAL_PR --json body -q .body 2>/dev/null || echo "")

          # 提取所有 Fixes #XX 或 Closes #XX 引用
          ISSUES=$(echo "$PR_BODY" | grep -oP '(?:Fixes|Closes|Resolves)\s+#\d+' | grep -oP '\d+')

          for ISSUE_NUM in $ISSUES; do
            echo "关闭 Issue #$ISSUE_NUM"
            # 先尝试关闭 Issue，再尝试添加评论（分开执行避免权限问题）
            gh issue close $ISSUE_NUM 2>/dev/null || echo "无法关闭 Issue #$ISSUE_NUM"
            gh issue comment $ISSUE_NUM --body "已合并到 main 分支，自动关闭。" 2>/dev/null || echo "无法评论 Issue #$ISSUE_NUM"
          done
