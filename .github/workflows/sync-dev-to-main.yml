# ============================================
# Dev 分支同步到 Main
# 功能：当 PR 合并到 dev 分支时，自动将更改同步到 main 分支
# 目的：保持 main 和 dev 分支同步，遵循"dev 修改 -> PR 合并到 main 部署"的规则
# ============================================

name: Sync Dev to Main

# 触发条件：当 PR 合并到 dev 分支时
on:
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  # 任务：同步到 main
  sync-to-main:
    # 仅在 PR 已合并时执行
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # 权限设置：需要写入代码仓库权限
    permissions:
      contents: write

    steps:
      # 步骤1：检出 dev 分支（PR 已合并到此分支）
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0  # 获取完整历史用于合并

      # 步骤2：配置 Git 用户信息（用于提交）
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 步骤3：将 dev 分支合并到 main
      - name: Merge dev to main
        run: |
          # 尝试合并 dev 到 main
          git fetch origin main
          git checkout main
          git merge origin/dev --no-edit || {
            # 如果合并失败（可能有冲突），记录错误
            echo "合并到 main 失败，可能存在冲突"
            exit 1
          }

      # 步骤4：推送到 origin main
      - name: Push to main
        run: |
          git push origin main

      # 步骤5：获取合并的 PR 信息，清理相关分支
      - name: Cleanup branches
        run: |
          # 获取所有以 fix/ 或 new-song/ 开头的分支
          git branch -r | grep -E "origin/(fix/|new-song/|auto/)" | while read branch; do
            # 提取分支名（去掉 origin/ 前缀）
            branch_name=$(echo "$branch" | sed 's/origin\///' | tr -d ' ')
            # 尝试删除远程分支
            git push origin --delete "$branch_name" 2>/dev/null && echo "已删除分支: $branch_name" || true
          done
