# ============================================
# Dev 分支同步到 Main
# 功能：当 PR 合并到 dev 分支时，自动将更改同步到 main 分支
# 目的：保持 main 和 dev 分支同步，遵循"dev 修改 -> PR 合并到 main 部署"的规则
# 实现方式：通过 GitHub API 创建 PR 并自动合并（绕过分支保护规则）
# ============================================

name: Sync Dev to Main

# 触发条件：当 PR 合并到 dev 分支时
on:
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  # 任务：同步到 main
  sync-to-main:
    # 仅在 PR 已合并时执行
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # 权限设置：需要写入代码仓库、管理 PR 的权限
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      # 步骤1：检出 dev 分支（PR 已合并到此分支）
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0  # 获取完整历史用于合并

      # 步骤2：创建从 dev 到 main 的 PR 并自动合并
      - name: Create PR and merge to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取当前 dev 分支的最新提交信息
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_SHA=$(git log -1 --pretty=%h)

          echo "正在从 dev 同步到 main..."
          echo "最新提交: $COMMIT_MSG ($COMMIT_SHA)"

          # 创建从 dev 到 main 的 PR
          PR_URL=$(gh pr create \
            --base main \
            --head dev \
            --title "sync: ${COMMIT_MSG}" \
            --body "自动同步 dev 分支到 main 分支

          提交: ${COMMIT_MSG} (${COMMIT_SHA})

          > 此 PR 由 Sync Dev to Main 工作流自动创建并合并。" \
            2>&1)

          echo "PR 已创建: $PR_URL"

          # 提取 PR 编号
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+' | tail -1)

          # 等待几秒确保 PR 创建完成
          sleep 3

          # 自动合并 PR（使用 --admin 绕过分支保护规则）
          gh pr merge $PR_NUM --merge --admin

          echo "已成功合并到 main 分支"

      # 步骤3：获取合并的 PR 信息，清理相关分支
      - name: Cleanup branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有以 fix/ 或 new-song/ 开头的远程分支
          for branch in $(git branch -r | grep -E "origin/(fix/|new-song/|auto/)" | sed 's/origin\///' | tr -d ' '); do
            # 尝试删除远程分支
            if gh api "repos/{owner}/{repo}/git/refs/heads/$branch" --silent 2>/dev/null; then
              git push origin --delete "$branch" 2>/dev/null && echo "已删除分支: $branch" || echo "无法删除分支: $branch"
            fi
          done

      # 步骤4：关闭关联的 Issue（如果 PR 描述中包含 Fixes #XX）
      - name: Close related issues
        if: always()  # 即使前面的步骤失败也执行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取触发此工作流的原始 PR 编号
          ORIGINAL_PR=${{ github.event.pull_request.number }}

          # 获取原始 PR 的描述，查找 Fixes #XX
          PR_BODY=$(gh pr view $ORIGINAL_PR --json body -q .body 2>/dev/null || echo "")

          # 提取所有 Fixes #XX 或 Closes #XX 引用
          ISSUES=$(echo "$PR_BODY" | grep -oP '(?:Fixes|Closes|Resolves)\s+#\d+' | grep -oP '\d+')

          for ISSUE_NUM in $ISSUES; do
            echo "关闭 Issue #$ISSUE_NUM"
            # 先尝试关闭 Issue，再尝试添加评论（分开执行避免权限问题）
            gh issue close $ISSUE_NUM 2>/dev/null || echo "无法关闭 Issue #$ISSUE_NUM"
            gh issue comment $ISSUE_NUM --body "已合并到 main 分支，自动关闭。" 2>/dev/null || echo "无法评论 Issue #$ISSUE_NUM"
          done
