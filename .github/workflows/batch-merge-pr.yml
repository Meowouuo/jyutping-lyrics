name: Batch Merge PRs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '合并模式 (recent=自动最近N个, manual=手动指定)'
        required: true
        default: 'recent'
        type: choice
        options:
          - recent
          - manual
      count:
        description: '合并数量 (recent模式)'
        required: false
        default: '5'
        type: string
      exclude:
        description: '排除的PR编号 (recent模式,逗号分隔如: 123,456)'
        required: false
        default: ''
        type: string
      pr_numbers:
        description: 'PR编号列表 (manual模式,逗号分隔如: 100,101,102)'
        required: false
        default: ''
        type: string
      auto_close_issue:
        description: '自动关闭关联Issue'
        required: false
        default: true
        type: boolean

jobs:
  batch-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Batch merge PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          COUNT: ${{ inputs.count }}
          EXCLUDE: ${{ inputs.exclude }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          AUTO_CLOSE: ${{ inputs.auto_close_issue }}
        run: node scripts/batch-merge.js

      - name: Sync dev to main
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 创建从 dev 到 main 的 PR
          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d '{"title":"sync: 批量合并后同步到 main","body":"此 PR 由批量合并工作流自动创建。","head":"dev","base":"main"}')
          
          PR_NUM=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number',''))")
          
          if [ -n "$PR_NUM" ]; then
            echo "PR #$PR_NUM 已创建"
            sleep 3
            # 合并 PR（使用 admin 权限绕过分支保护）
            curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUM/merge" \
              -d '{"merge_method":"merge"}'
            echo "PR #$PR_NUM 已合并到 main"
          else
            echo "PR 创建失败或无需同步"
          fi
      # songFiles.js 由 Sync Dev to Main 工作流自动更新，无需额外触发
